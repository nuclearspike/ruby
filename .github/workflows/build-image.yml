name: build-ruby-timelocal-image
on:
  workflow_dispatch: {}
  push:
    branches: [timelocal-image]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04   # amd64 — matches Heroku dynos
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nuclearspike/ruby-timelocal:3.3.10-timelocal.1
            ghcr.io/nuclearspike/ruby-timelocal:3.3.10
