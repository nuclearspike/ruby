name: build-ruby-timelocal-image
on:
  workflow_dispatch: {}
  push:
    branches: [timelocal-image]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04   # amd64 — matches Heroku dynos
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nuclearspike/ruby-timelocal:3.3.10-timelocal.1
            ghcr.io/nuclearspike/ruby-timelocal:3.3.10

      # Native amd64 timezone differential, tzdata and libc held constant:
      # stock v3_3_10 and the patched tag are both built inside one image and
      # compared there. Any difference in epoch seconds, UTC offset, DST flag
      # or zone abbreviation fails the build. This is the amd64 leg of the same
      # check run on macOS arm64 and Linux aarch64 (emulated amd64 cannot host
      # it — qemu's tar returns ENOSYS on nested directories).
      - name: Timezone parity, stock vs patched (native amd64, same tzdata)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.parity
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
